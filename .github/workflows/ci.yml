name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check authzkit authz_service authz_sdk tests
      - name: Test
        run: pytest -q --cov=authzkit --cov=authz_service --cov=authz_sdk

  go:
    name: Go SDK tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdks/go/authz } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdks/go/authz/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  typescript:
    name: TypeScript SDK tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdks/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/typescript/package.json
      - run: npm install --no-fund --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  csharp:
    name: C# SDK tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdks/csharp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
      - name: Smoke test image
        run: |
          # Default config: SQLite under the /data volume, no DB URL needed.
          docker run --rm -d --name authz-smoke \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in {1..30}; do
            if curl -fs http://localhost:8080/healthz > /dev/null; then
              echo "service is healthy"
              curl -fs http://localhost:8080/admin/ | grep -q "AuthZ Admin" \
                || { echo "admin UI not served"; docker stop authz-smoke; exit 1; }
              echo "admin UI is served"
              docker stop authz-smoke
              exit 0
            fi
            sleep 1
          done
          echo "service did not become healthy"
          docker logs authz-smoke
          docker stop authz-smoke
          exit 1
      - name: Push (main → latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
      - name: Push (release tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
